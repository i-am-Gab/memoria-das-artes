<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memória das Artes</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="game">

        <!-- =========================
             MENU INICIAL
             ========================= -->

        <section class="menu" id="menu">

            <h1>Memória das Artes</h1>

            <p>
                Escolha uma categoria para começar:
            </p>

            <div class="categories">

                <button
                    class="category-button"
                    data-category="cidades">
                    Cidades
                </button>

                <button
                    class="category-button"
                    data-category="plantas">
                    Plantas
                </button>

                <button
                    class="category-button"
                    data-category="pessoas">
                    Pessoas
                </button>

            </div>

        </section>


        <!-- =========================
             ESCOLHA DA DIFICULDADE
             ========================= -->

        <section
            class="difficulty-menu"
            id="difficultyMenu">

            <h1>Escolha a dificuldade</h1>

            <p id="selectedCategory">
            </p>

            <div class="difficulties">

                <button
                    class="difficulty-button easy"
                    data-pairs="4">
                    Fácil
                    <span>4 pares</span>
                </button>

                <button
                    class="difficulty-button medium"
                    data-pairs="8">
                    Médio
                    <span>8 pares</span>
                </button>

                <button
                    class="difficulty-button hard"
                    data-pairs="12">
                    Difícil
                    <span>12 pares</span>
                </button>

            </div>

            <button
                class="back-button"
                id="backToCategoryButton">
                Voltar
            </button>

        </section>


        <!-- =========================
             ÁREA DO JOGO
             ========================= -->

        <section
            class="game-board"
            id="gameBoard">

            <header class="game-header">

                <h1>Memória das Artes</h1>

                <p id="categoryName"></p>

                <p id="difficultyName"></p>

                <div class="game-info">

                    <span>
                        Tentativas:
                        <strong id="attempts">0</strong>
                    </span>

                    <span>
                        Pares:
                        <strong id="pairs">0</strong>/<span id="totalPairs">4</span>
                    </span>

                </div>

            </header>


            <!-- TABULEIRO -->

            <section
                class="memory-game"
                id="memoryGame">
            </section>


            <!-- MENSAGEM -->

            <div
                class="game-message"
                id="gameMessage">
            </div>


            <!-- BOTÕES -->

            <div class="game-buttons">

                <button
                    class="restart-button"
                    id="restartButton">
                    Novo jogo
                </button>

                <button
                    class="menu-button"
                    id="menuButton">
                    Voltar ao menu
                </button>

            </div>

        </section>

    </main>


    <!-- =========================
         MODAL DA PINTURA
         ========================= -->

    <div
        class="image-modal"
        id="imageModal">

        <div class="image-modal-content">

            <button
                class="close-modal"
                id="closeModal"
                aria-label="Fechar imagem">
                &times;
            </button>

            <img
                id="largeImage"
                src=""
                alt="">

        </div>

    </div>


    <script src="js/script.js"></script>

</body>

</html>
