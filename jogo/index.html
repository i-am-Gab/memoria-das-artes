<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memória das Artes</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="game">

        <!-- Menu inicial -->

        <section class="menu" id="menu">

            <h1>Memória das Artes</h1>

            <p>
                Escolha uma categoria para começar:
            </p>

            <div class="categories">

                <button class="category-button" data-category="cidades">
                    Cidades
                </button>

                <button class="category-button" data-category="plantas">
                    Plantas
                </button>

                <button class="category-button" data-category="pessoas">
                    Pessoas
                </button>

            </div>

        </section>


        <!-- Jogo -->

        <section class="game-board" id="gameBoard">

            <header class="game-header">

                <h1>Memória das Artes</h1>

                <p id="categoryName"></p>

                <div class="game-info">

                    <span>
                        Tentativas:
                        <strong id="attempts">0</strong>
                    </span>

                    <span>
                        Pares:
                        <strong id="pairs">0</strong>/8
                    </span>

                </div>

            </header>


            <!-- Cartas serão criadas pelo JavaScript -->

            <section
                class="memory-game"
                id="memoryGame">
            </section>


            <div
                class="game-message"
                id="gameMessage">
            </div>


            <div class="game-buttons">

                <button
                    class="restart-button"
                    id="restartButton">
                    Novo jogo
                </button>

                <button
                    class="menu-button"
                    id="menuButton">
                    Voltar ao menu
                </button>

            </div>

        </section>

    </main>

    <!-- Janela para visualizar a pintura ampliada -->

    <div class="image-modal" id="imageModal">

        <div class="image-modal-content">

            <button
                class="close-modal"
                id="closeModal">
                ×
            </button>

            <img
                id="largeImage"
                src=""
                alt="Pintura ampliada">

        </div>

    </div>


    <script src="js/script.js"></script>

</body>

</html>
