<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jogo da Memória</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="game">

        <header class="game-header">
            <h1>Jogo da Memória</h1>

            <p>
                Encontre todos os pares de cartas!
            </p>

            <div class="game-info">
                <span>Tentativas: <strong id="attempts">0</strong></span>
                <span>Pares: <strong id="pairs">0</strong>/8</span>
            </div>
        </header>


        <section class="memory-game" id="memoryGame">

            <button class="card" data-card="1">
                <img src="assets/img/1.jpg" alt="Carta 1">
            </button>

            <button class="card" data-card="2">
                <img src="assets/img/2.jpg" alt="Carta 2">
            </button>

            <button class="card" data-card="3">
                <img src="assets/img/3.jpg" alt="Carta 3">
            </button>

            <button class="card" data-card="4">
                <img src="assets/img/4.jpg" alt="Carta 4">
            </button>

            <button class="card" data-card="5">
                <img src="assets/img/5.jpg" alt="Carta 5">
            </button>

            <button class="card" data-card="6">
                <img src="assets/img/6.jpg" alt="Carta 6">
            </button>

            <button class="card" data-card="7">
                <img src="assets/img/7.jpg" alt="Carta 7">
            </button>

            <button class="card" data-card="8">
                <img src="assets/img/8.jpg" alt="Carta 8">
            </button>

            <button class="card" data-card="1">
                <img src="assets/img/1.jpg" alt="Carta 1">
            </button>

            <button class="card" data-card="2">
                <img src="assets/img/2.jpg" alt="Carta 2">
            </button>

            <button class="card" data-card="3">
                <img src="assets/img/3.jpg" alt="Carta 3">
            </button>

            <button class="card" data-card="4">
                <img src="assets/img/4.jpg" alt="Carta 4">
            </button>

            <button class="card" data-card="5">
                <img src="assets/img/5.jpg" alt="Carta 5">
            </button>

            <button class="card" data-card="6">
                <img src="assets/img/6.jpg" alt="Carta 6">
            </button>

            <button class="card" data-card="7">
                <img src="assets/img/7.jpg" alt="Carta 7">
            </button>

            <button class="card" data-card="8">
                <img src="assets/img/8.jpg" alt="Carta 8">
            </button>

        </section>


        <div class="game-message" id="gameMessage"></div>


        <button class="restart-button" id="restartButton">
            Novo jogo
        </button>

    </main>

    <script src="js/script.js"></script>

</body>
</html>
